name: Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDynamicESP
          path: bin/Release/net6.0/MyDynamicESP.dll
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MyDynamicESP
          path: artifacts

      - name: Extract zip if present
        shell: bash
        run: |
          shopt -s globstar nullglob
          for z in artifacts/**/*.zip; do
            echo "Extracting $z"
            unzip -o "$z" -d artifacts/extracted
          done

      - name: Compute next release number
        id: next_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Получаем все теги релизов, отфильтровываем те, что соответствуют формату pre-release-N
          TAGS=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' || true)
          MAX_NUM=0
          for tag in $TAGS; do
            if [[ "$tag" =~ ^pre-release-([0-9]+)$ ]]; then
              num="${BASH_REMATCH[1]}"
              if (( num > MAX_NUM )); then
                MAX_NUM=$num
              fi
            fi
          done
          NEXT_NUM=$((MAX_NUM + 1))
          echo "tag=pre-release-${NEXT_NUM}" >> "$GITHUB_OUTPUT"
          echo "name=Pre-Release ${NEXT_NUM}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_release.outputs.tag }}
          name: ${{ steps.next_release.outputs.name }}
          body: Testing release dll
          prerelease: true
          files: |
            artifacts/**/*.dll
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}