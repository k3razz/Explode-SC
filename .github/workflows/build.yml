name: Build BepInEx Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      # Скачиваем BepInEx 6 IL2CPP и извлекаем нужные DLL
      - name: Download BepInEx IL2CPP
        shell: pwsh
        run: |
          $url = "https://builds.bepinex.dev/projects/bepinex_be/733/BepInEx-Unity.IL2CPP-win-x64-6.0.0-be.733%2B06a7278.zip"
          Invoke-WebRequest -Uri $url -OutFile bepinex.zip
          Expand-Archive -Path bepinex.zip -DestinationPath bepinex_temp -Force

          New-Item -ItemType Directory -Force -Path libs/core
          New-Item -ItemType Directory -Force -Path libs/interop

          Copy-Item "bepinex_temp/BepInEx/core/BepInEx.Core.dll" -Destination libs/core/
          Copy-Item "bepinex_temp/BepInEx/core/BepInEx.Unity.IL2CPP.dll" -Destination libs/core/
          Copy-Item "bepinex_temp/BepInEx/core/0Harmony.dll" -Destination libs/core/
          Copy-Item "bepinex_temp/BepInEx/core/Il2CppInterop.Runtime.dll" -Destination libs/core/

          Copy-Item "bepinex_temp/BepInEx/interop/UnityEngine.CoreModule.dll" -Destination libs/interop/
          Copy-Item "bepinex_temp/BepInEx/interop/UnityEngine.IMGUIModule.dll" -Destination libs/interop/

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDynamicESP
          path: bin/Release/net6.0/MyDynamicESP.dll
          if-no-files-found: error
