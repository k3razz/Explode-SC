name: Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDynamicESP
          path: bin/Release/net6.0/MyDynamicESP.dll
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MyDynamicESP
          path: artifacts

      - name: Extract zip if present
        shell: bash
        run: |
          shopt -s globstar nullglob
          for z in artifacts/**/*.zip; do
            echo "Extracting $z"
            unzip -o "$z" -d artifacts/extracted
          done

      - name: List files to release
        shell: bash
        run: |
          echo "DLLs found:"
          find artifacts -name '*.dll' -type f

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testing
          name: Pre-Release
          body: Testing release dll
          prerelease: true
          files: |
            artifacts/**/*.dll
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}